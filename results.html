<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Real-Time - Pemilu OSIS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between">

    <!-- Header Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 flex justify-between items-center shadow-md">
        <div>
            <h1 class="text-xl font-bold tracking-wide">REKAPITULASI SUARA PEMILU OSIS</h1>
            <p class="text-xs text-slate-400">Hasil Pemungutan Suara Secara Real-Time</p>
        </div>
        <div>
            <a href="index.html" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm font-medium transition duration-200">
                Kembali ke Beranda
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-8 max-w-5xl">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-extrabold text-blue-400 mb-2">Live Count Suara Kandidat</h2>
            <p class="text-slate-400 text-sm">Data di bawah ini diperbarui secara otomatis dari database Firestore.</p>
        </div>

        <!-- Container Grid Kandidat / Hasil -->
        <div id="results-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Loading State -->
            <div class="col-span-2 text-center py-12 text-slate-400 animate-pulse">
                Memuat data perolehan suara...
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 py-4 text-center text-xs text-slate-500">
        &copy; 2026 Portal Pemilu OSIS. All rights reserved.
    </footer>

    <!-- Firebase SDK & Real-time Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        // Konfigurasi Firebase (Sesuaikan dengan project kamu jika berbeda)
        const firebaseConfig = {
            apiKey: "ISI_API_KEY_KAMU",
            authDomain: "ISI_AUTH_DOMAIN_KAMU",
            projectId: "pemilihan-ketos-2627",
            storageBucket: "ISI_STORAGE_BUCKET_KAMU",
            messagingSenderId: "ISI_MESSAGING_SENDER_ID_KAMU",
            appId: "ISI_APP_ID_KAMU"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const resultsContainer = document.getElementById("results-container");

        // Real-time listener menggunakan onSnapshot
        onSnapshot(collection(db, "candidates"), (snapshot) => {
            resultsContainer.innerHTML = ""; // Bersihkan kontainer

            if (snapshot.empty) {
                resultsContainer.innerHTML = `<div class="col-span-2 text-center text-slate-400 py-8">Belum ada kandidat yang terdaftar.</div>`;
                return;
            }

            let totalSuaraSemua = 0;
            let candidatesData = [];

            snapshot.forEach((doc) => {
                const data = doc.data();
                candidatesData.push({ id: doc.id, ...data });
                totalSuaraSemua += (data.votes || 0);
            });

            // Render ke HTML
            candidatesData.forEach((candidate, index) => {
                const votes = candidate.votes || 0;
                const percentage = totalSuaraSemua > 0 ? ((votes / totalSuaraSemua) * 100).toFixed(1) : 0;
                
                const card = `
                    <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-lg flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-4">
                                <span class="bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">
                                    Nomor Urut ${index + 1}
                                </span>
                                <span class="text-2xl font-black text-blue-400">${votes} <span class="text-xs text-slate-400 font-normal">Suara</span></span>
                            </div>
                            <h3 class="text-xl font-bold mb-2">${candidate.name || 'Nama Kandidat'}</h3>
                            <p class="text-xs text-slate-400 mb-4 italic">"${candidate.vision || '-'}"</p>
                        </div>

                        <div>
                            <!-- Progress Bar -->
                            <div class="w-full bg-slate-700 rounded-full h-3 mb-2 overflow-hidden">
                                <div class="bg-blue-500 h-3 rounded-full transition-all duration-500" style="width: ${percentage}%"></div>
                            </div>
                            <div class="flex justify-between text-xs text-slate-400">
                                <span>Persentase</span>
                                <span class="font-bold text-slate-200">${percentage}%</span>
                            </div>
                        </div>
                    </div>
                `;
                resultsContainer.innerHTML += card;
            });
        }, (error) => {
            console.error("Gagal memuat data real-time: ", error);
            resultsContainer.innerHTML = `<div class="col-span-2 text-center text-red-400 py-8">Gagal memuat data suara. Periksa koneksi atau konfigurasi database.</div>`;
        });
    </script>
</body>
</html>
