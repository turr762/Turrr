<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Real-Time - Pemilihan Ketua OSIS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between">

    <!-- Header Navbar (No Shortcuts to Login) -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 flex justify-between items-center shadow-md">
        <div>
            <h1 class="text-xl font-bold tracking-wide">OSIS SMPN 219 JAKARTA</h1>
            <p class="text-xs text-slate-400">Hasil voting</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-8 max-w-5xl">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-extrabold text-blue-400 mb-2">Hasil Suara Pemilihan ketua osis</h2>
            <p class="text-slate-400 text-sm">OSIS SMPN 219 JAKARTA</p>
        </div>

        <!-- Container Diagram Bar / Hasil -->
        <div id="results-container" class="space-y-6">
            <!-- Loading State -->
            <div class="text-center py-12 text-slate-400 animate-pulse">
                Memuat data perolehan suara...
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 py-4 text-center text-xs text-slate-500">
        &copy; 2026 Muhamad Rafa Fathur Rohman. All rights reserved.
    </footer>

    <!-- Firebase SDK & Real-time Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB1Ab-K6ehYQZbjX-QxJQiodqSajGPFdmE",
            authDomain: "pemilihan-ketos-2627.firebaseapp.com",
            projectId: "pemilihan-ketos-2627",
            storageBucket: "pemilihan-ketos-2627.firebasestorage.app",
            messagingSenderId: "924205874158",
            appId: "1:924205874158:web:be0bab0495c02d1182acff"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const resultsContainer = document.getElementById("results-container");

        onSnapshot(collection(db, "candidates"), (snapshot) => {
            resultsContainer.innerHTML = "";

            if (snapshot.empty) {
                resultsContainer.innerHTML = `<div class="text-center text-slate-400 py-8">Belum ada kandidat yang terdaftar di database.</div>`;
                return;
            }

            let totalSuaraSemua = 0;
            let candidatesData = [];

            snapshot.forEach((doc) => {
                const data = doc.data();
                candidatesData.push({ id: doc.id, ...data });
                totalSuaraSemua += (data.votes || 0);
            });

            // Render Diagram Bars with names directly synced from collection documents
            candidatesData.forEach((candidate, index) => {
                const votes = candidate.votes || 0;
                const percentage = totalSuaraSemua > 0 ? ((votes / totalSuaraSemua) * 100).toFixed(1) : 0;
                
                const barCard = `
                    <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-lg">
                        <div class="flex justify-between items-center mb-2 flex-wrap gap-2">
                            <span class="text-lg font-bold text-slate-100">
                                Nomor Urut ${candidate.id} - ${candidate.names || 'Nama Kandidat'}
                            </span>
                            <span class="text-xl font-black text-blue-400">${votes} <span class="text-xs text-slate-400 font-normal">Suara (${percentage}%)</span></span>
                        </div>
                        <p class="text-xs text-slate-400 mb-4 italic">Visi & Misi: "${candidate.vision || '-'}"</p>
                        
                        <!-- Diagram Bar / Progress Bar -->
                        <div class="w-full bg-slate-700 rounded-full h-4 overflow-hidden">
                            <div class="bg-blue-500 h-4 rounded-full transition-all duration-500" style="width: ${percentage}%"></div>
                        </div>
                    </div>
                `;
                resultsContainer.innerHTML += barCard;
            });
        }, (error) => {
            console.error("Gagal memuat data real-time: ", error);
            resultsContainer.innerHTML = `<div class="text-center text-red-400 py-8">Gagal memuat data suara.</div>`;
        });
    </script>
</body>
</html>
