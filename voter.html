<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Voter - Pemilihan OSIS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <img src="assets/img/logo.png" alt="Logo OSIS">
        <h1>SMPN 219 JAKARTA</h1>
    </header>

    <main class="main-container">
        <div class="card">
            <h2>Login Voter</h2>
            
            <form id="formLoginVoter">
								  <p id="pesanErrorVoter" style="color: red; font-size: 14px; display: none; margin-bottom: 15px; text-align: left;"></p> 
                <input type="text" id="nisVoter" placeholder="Masukkan NIS" required class="input-field">
                <input type="password" id="passVoter" placeholder="Masukkan Password" required class="input-field">
                <button type="submit" class="btn">Masuk</button>
            </form>

            <a href="index.html" class="link-kembali">Kembali ke Halaman Awal</a>
        </div>
    </main>

    <footer>
        &copy; OSIS SMPN 219 JAKARTA
    </footer>

    <script type="module" src="main.js"></script>
</body>
</html>
