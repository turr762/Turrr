<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Real-Time - Pemilu OSIS 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-blue-900 to-indigo-950 min-h-screen text-slate-100 font-sans antialiased flex flex-col justify-between p-4">

    <!-- Top Navigation Bar -->
    <header class="max-w-4xl w-full mx-auto bg-slate-900/80 backdrop-blur border border-slate-800 px-6 py-4 rounded-2xl flex justify-between items-center shadow-lg">
        <div>
            <span class="text-xs text-blue-400 font-semibold tracking-wider uppercase">Live Quick Count</span>
            <h1 class="text-lg font-bold text-white">Hasil Pemilihan OSIS 2026</h1>
        </div>
        <a href="index.html" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg transition shadow">Kembali ke Login</a>
    </header>

    <!-- Main Live Content -->
    <main class="max-w-4xl w-full mx-auto my-8 space-y-6">
        <div class="bg-white text-slate-900 rounded-2xl shadow-2xl p-8 border border-slate-200 space-y-6">
            <div class="text-center space-y-1">
                <h2 class="text-2xl font-bold text-slate-900">Hitung Cepat Real-Time Database</h2>
                <p class="text-sm text-slate-500">Data ini diperbarui secara langsung saat pemilih menyelesaikan suara mereka.</p>
            </div>

            <!-- Summary metrics -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center">
                    <p class="text-xs text-slate-500 font-semibold uppercase">Total Suara Masuk</p>
                    <p id="public-total-votes" class="text-2xl font-bold text-slate-900 mt-1">0</p>
                </div>
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center">
                    <p class="text-xs text-slate-500 font-semibold uppercase">Total Pemilih Terdaftar</p>
                    <p id="public-total-voters" class="text-2xl font-bold text-blue-600 mt-1">3</p>
                </div>
            </div>

            <!-- Progress Bars Breakdown -->
            <div id="public-results-breakdown" class="space-y-4 pt-2">
                <!-- Rendered via JS -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-400 py-2">
        Sistem Pemilihan OSIS Berbasis Web &bull; Real-Time Database
    </footer>

    <script src="script.js"></script>
</body>
</html>
