<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Pemilihan OSIS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <img src="assets/img/logo.png" alt="Logo OSIS">
        <h1>SMPN 219 JAKARTA</h1>
    </header>

    <main class="main-container">
        <div class="card">
            <h2>Login Admin</h2>
            
            <!-- Form Login Admin -->
            <form id="formLoginAdmin">
                <input type="text" id="nisAdmin" placeholder="Masukkan NIS Admin" required class="input-field">
                <input type="password" id="passAdmin" placeholder="Masukkan Password" required class="input-field">
                <button type="submit" class="btn">Masuk</button>
            </form>

            <a href="index.html" class="link-kembali">Kembali ke Halaman Awal</a>
        </div>
    </main>

    <footer>
        &copy;SMPN 219 JAKARTA.
    </footer>

    <script type="module" src="main.js"></script>
</body>
</html>
