<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Pemilihan OSIS 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-blue-900 to-indigo-950 min-h-screen text-slate-100 font-sans antialiased flex items-center justify-center p-4">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="max-w-md w-full bg-white text-slate-800 rounded-2xl shadow-2xl p-8 border border-slate-100">
        <div class="text-center mb-8">
            <span class="text-xs font-semibold tracking-wider text-indigo-600 uppercase">Student Council Election • 2026</span>
            <h1 class="text-2xl font-bold text-slate-900 mt-1">Sistem Pemilihan OSIS</h1>
            <p class="text-sm text-slate-500 mt-1">Silakan masuk dengan NIS / ID Anda</p>
        </div>
        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">NIS / ID Akun</label>
                <input type="text" id="username" required placeholder="Contoh: 1001 atau admin01" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition duration-200 shadow-md">
                Masuk Sistem
            </button>
        </form>
        
        <div class="mt-6 flex justify-between items-center text-xs">
            <a href="results.html" target="_blank" class="text-blue-600 hover:underline font-medium"> Lihat Hasil Hitung Cepat &rarr;</a>
            <span class="text-slate-400">v2.6 Secure</span>
        </div>

        <div class="mt-4 text-xs text-slate-400 bg-slate-50 p-3 rounded-lg border border-slate-200">
            <span class="font-semibold text-slate-600">Info Akun Uji Coba:</span><br>
            • Siswa: <code class="text-blue-600">1001</code> / pass: <code class="text-slate-600">123</code><br>
            • Guru: <code class="text-blue-600">2001</code> / pass: <code class="text-slate-600">123</code><br>
            • Admin: <code class="text-blue-600">admin01</code> / pass: <code class="text-slate-600">admin123</code>
        </div>
    </div>

    <!-- CUSTOM NOTIFICATION MODAL (Replaces Browser Alerts) -->
    <div id="custom-alert-modal" class="hidden fixed inset-0 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white text-slate-900 rounded-2xl max-w-sm w-full shadow-2xl p-6 text-center space-y-4 border border-slate-200">
            <div id="alert-icon-wrapper" class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center mx-auto font-bold text-xl">i</div>
            <h4 id="alert-title" class="text-lg font-bold text-slate-900">Informasi Sistem</h4>
            <p id="alert-message" class="text-sm text-slate-600">Pesan sistem akan muncul di sini.</p>
            <button onclick="closeCustomAlert()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl transition shadow">Mengerti</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
